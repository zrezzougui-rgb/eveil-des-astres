name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Copier le jeu dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk eveil-des-astres.apk

      - name: Publier l'APK dans la release "derniere-version"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Dernière version du jeu
          body: |
            APK de test construit automatiquement depuis le commit ${{ github.sha }}.
            Téléchargez **eveil-des-astres.apk** depuis votre téléphone puis ouvrez-le pour l'installer.
          files: eveil-des-astres.apk
          make_latest: true
          prerelease: false
