name: Construire l'APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk orbite.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: orbite-apk
          path: orbite.apk

      - name: Publier l'APK dans la release "derniere-version"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Dernière version d'Orbite
          body: |
            APK de test construit automatiquement depuis le commit ${{ github.sha }}.
            Téléchargez **orbite.apk** depuis votre téléphone puis ouvrez-le pour l'installer.
          files: orbite.apk
          make_latest: true
