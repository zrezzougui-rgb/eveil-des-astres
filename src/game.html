<title>Éveil des Astres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app mobile — en-tête ressources, 3 onglets (Invocation / Héros / Combat), panneaux plein largeur, fiche héros en tiroir. Univers : observatoire nocturne, laiton et encre. Un seul thème sombre, choisi volontairement. */
:root {
  --ink: #121731;
  --ink-2: #1a2143;
  --ink-3: #252d57;
  --line: #333c6e;
  --text: #e8e6f2;
  --muted: #9ea3c4;
  --brass: #d9ad62;
  --brass-hi: #f3d08f;
  --r3: #8ea3c7;
  --r4: #b98bf0;
  --r5: #f2c46b;
  --ok: #6fcf8e;
  --bad: #ef6f6f;
  --fire: #e2744f; --water: #4fa6e3; --nature: #6fbf73; --light: #f0d27a;
  --shadow: #9b7ce2; --earth: #bb8c5c; --astral: #74d4cd;
  --f-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-image:
    radial-gradient(1px 1px at 12% 18%, var(--muted) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 8%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 60% 42%, var(--brass) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 70%, var(--muted) 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 80%, var(--muted) 50%, transparent 51%),
    radial-gradient(ellipse at 50% -10%, var(--ink-3), var(--ink) 60%);
  background-attachment: fixed;
}
.app { max-width: 980px; margin: 0 auto; padding: 16px; padding-block: 12px 110px; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin-inline: -16px; padding: 8px 16px; background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(8px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .04em; color: var(--brass-hi); margin: 0; }
.brand small { display: block; font-family: var(--f-body); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.wallet { display: flex; gap: 8px; flex-wrap: wrap; }
.coin { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; }
.coin i { width: 12px; height: 12px; display: inline-block; transform: rotate(45deg); background: var(--astral); border-radius: 2px; }
.coin.pot i { transform: none; border-radius: 50% 50% 40% 40%; background: var(--ok); }
.coin.stage i { transform: none; border-radius: 0; background: none; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid var(--brass); width: 0; height: 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav.tabs button { position: relative; background: none; border: 0; padding: 6px 2px 4px; border-radius: 12px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; font-size: .74rem; }
nav.tabs svg { width: 26px; height: 26px; }
nav.tabs button[aria-selected="true"] { color: var(--brass-hi); background: var(--ink-3); }
nav.tabs .badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: var(--text); font-size: .7rem; line-height: 18px; font-variant-numeric: tabular-nums; }

.panel { display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }

/* ---------- Invocation ---------- */
.altar { position: relative; border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--brass) 22%, transparent), transparent 55%), var(--ink-2); display: grid; gap: 18px; justify-items: center; text-align: center; overflow: hidden; }
.sigil { width: 132px; height: 132px; border-radius: 50%; border: 1px solid var(--brass); position: relative; display: grid; place-items: center; }
.sigil::before, .sigil::after { content: ""; position: absolute; inset: 14px; border: 1px dashed color-mix(in srgb, var(--brass) 60%, transparent); border-radius: 50%; animation: spin 40s linear infinite; }
.sigil::after { inset: 32px; border-style: solid; transform: rotate(45deg); border-radius: 8px; animation-duration: 24s; animation-direction: reverse; }
.sigil span { font-family: var(--f-display); font-size: 2.4rem; color: var(--brass-hi); }
.altar.casting .sigil::before, .altar.casting .sigil::after { animation-duration: 1.2s; }
@keyframes spin { to { transform: rotate(360deg); } }
.pull-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--ink-3); padding: 10px 16px; border-radius: 12px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.primary { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--ink); border-color: var(--brass-hi); }
.btn small { font-weight: 500; opacity: .8; }
.pity { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; width: 100%; max-width: 560px; }
.meter { text-align: left; display: grid; gap: 5px; font-size: .85rem; }
.meter .bar { height: 6px; border-radius: 3px; background: var(--ink); overflow: hidden; }
.meter .bar b { display: block; height: 100%; background: var(--r5); }
.meter.r4 .bar b { background: var(--r4); }
.meter .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.rates { font-size: .82rem; color: var(--muted); max-width: 60ch; }
.rates b { color: var(--text); font-weight: 600; }

.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.results .card { animation: reveal .45s both; }
@keyframes reveal { from { opacity: 0; transform: translateY(10px) scale(.92); } to { opacity: 1; transform: none; } }

/* ---------- Cartes héros ---------- */
.card { position: relative; border-radius: 14px; padding: 8px; background: var(--ink-2); border: 1px solid var(--line); display: grid; gap: 6px; text-align: center; min-width: 0; }
button.card { width: 100%; }
.card.r4 { border-color: color-mix(in srgb, var(--r4) 55%, var(--line)); }
.card.r5 { border-color: var(--r5); box-shadow: 0 0 18px -4px color-mix(in srgb, var(--r5) 70%, transparent); }
.card.evo { background: linear-gradient(160deg, color-mix(in srgb, var(--r5) 20%, var(--ink-2)), var(--ink-2)); }
.portrait { aspect-ratio: 1; max-width: 100%; border-radius: 10px; display: grid; place-items: center; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--el) 70%, transparent), color-mix(in srgb, var(--el) 12%, var(--ink)) 70%); }
.portrait span { font-family: var(--f-display); font-size: 2.3rem; color: var(--text); text-shadow: 0 2px 10px rgba(0,0,0,.45); }
.portrait::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); }
.portrait.art::after { display: none; }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.evo .portrait.art { box-shadow: inset 0 0 0 2px var(--r5); }
.card.evo .portrait.art img { filter: saturate(1.25) brightness(1.08) drop-shadow(0 0 6px var(--r5)); }
.unit .av { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 8px; overflow: hidden; justify-self: center; background: var(--ink-3); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.4rem; }
.unit .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.evo .portrait::after { border: 2px solid var(--r5); }
.card .nm { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stars { color: var(--r5); font-size: .75rem; letter-spacing: 1px; line-height: 1; }
.stars.r3 { color: var(--r3); } .stars.r4 { color: var(--r4); }
.tag { position: absolute; top: 12px; left: 12px; font-size: .64rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--ok); color: var(--ink); }
.tag.dupe { background: var(--ink-3); color: var(--text); border: 1px solid var(--line); }
.lvl { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.team-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--brass-hi); box-shadow: 0 0 0 2px var(--ink); }
.card.locked { opacity: .35; filter: grayscale(.8); }

/* ---------- Héros ---------- */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.toolbar { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.sheet { border: 1px solid var(--line); border-radius: 18px; background: var(--ink-2); padding: 18px; display: grid; grid-template-columns: 160px 1fr; gap: 18px; }
@media (max-width: 560px) { .sheet { grid-template-columns: 1fr; } .sheet .card { max-width: 180px; justify-self: center; width: 100%; } }
.sheet-body { display: grid; gap: 12px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .74rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink); }
.chip.el { border-color: var(--el); color: var(--el); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--ink); border-radius: 10px; padding: 8px 10px; display: grid; }
.stat small { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
.stat b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.path { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.path div { font-size: .7rem; text-align: center; padding: 6px 2px; border-radius: 8px; background: var(--ink); color: var(--muted); border: 1px solid transparent; }
.path div.done { color: var(--r5); border-color: color-mix(in srgb, var(--r5) 40%, transparent); }
.path div.now { color: var(--ink); background: var(--r5); font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.skill { font-size: .88rem; padding: 10px 12px; border-radius: 10px; background: var(--ink); border-left: 3px solid var(--r5); }
.skill.off { border-left-color: var(--line); color: var(--muted); }

/* ---------- Combat : scène ---------- */
.scene { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 62vh; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--sky2); user-select: none; -webkit-user-select: none; }
@media (min-width: 700px) { .scene { aspect-ratio: 16 / 9; } }
.scene .sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1), var(--sky2) 70%); }
.scene .orb { position: absolute; top: 7%; left: 44%; width: 11%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fffbe8, color-mix(in srgb, var(--sky2) 40%, #fff6c8) 60%, transparent 72%); opacity: .85; }
.scene .hills { position: absolute; left: 0; right: 0; bottom: 36%; height: 26%; background: radial-gradient(ellipse 60% 100% at 25% 100%, var(--hill) 60%, transparent 61%), radial-gradient(ellipse 55% 85% at 80% 100%, var(--hill) 60%, transparent 61%); background-size: 100% 100%; background-repeat: repeat-x; }
.scene .hills.far { bottom: 40%; height: 22%; opacity: .45; filter: blur(1px); background-position: 40% 0; }
.scene .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background:
  repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.07) 46px 50px, transparent 50px 90px, rgba(0,0,0,.08) 90px 94px),
  linear-gradient(180deg, color-mix(in srgb, var(--ground) 85%, #fff) 0 3px, var(--ground) 3px, color-mix(in srgb, var(--ground) 55%, #000)); }
.scene.walking .ground { animation: scroll .45s linear infinite; }
.scene.walking .hills { animation: scroll 2.2s linear infinite; }
@keyframes scroll { to { background-position-x: -94px; } }
.u { position: absolute; width: 19%; max-width: 120px; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 3px; transition: opacity .5s, filter .5s; }
.u.boss { width: 40%; max-width: 250px; }
.u .body { width: 100%; animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
.u.foe .body { animation-duration: 1.3s; }
.u .body svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.u.foe .body svg { transform: scaleX(1); }
@keyframes bob { 50% { transform: translateY(-5%) scaleY(1.03); } }
.scene.walking .u.hero .body { animation-duration: .45s; }
.scene.walking .u.foe { animation: enter .9s ease-out both; }
@keyframes enter { from { margin-left: 40%; opacity: 0; } to { margin-left: 0; opacity: 1; } }
.tok { width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 3px solid var(--el); background: var(--ink-3); box-shadow: 0 4px 0 rgba(0,0,0,.3); display: grid; place-items: center; }
.tok img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tok span { font-family: var(--f-display); font-size: 1.8rem; }
.u.hero.evo .tok { border-color: var(--r5); box-shadow: 0 0 14px var(--r5), 0 4px 0 rgba(0,0,0,.3); }
.u .shadow { width: 70%; height: 8px; margin-top: -6px; border-radius: 50%; background: rgba(0,0,0,.28); }
.hpbar { width: 84%; height: 7px; border-radius: 4px; background: rgba(0,0,0,.55); border: 1px solid rgba(0,0,0,.6); overflow: hidden; }
.hpbar b { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .3s; }
.u.foe .hpbar b { background: var(--bad); }
.hpbar b.low { background: #f2a83b; }
.u.boss .hpbar { height: 10px; }
.u.dead { opacity: 0; filter: grayscale(1); }
.u.hitfx .body { animation: hitflash .3s; }
@keyframes hitflash { 0% { filter: brightness(2.4); transform: translateX(-4px); } 50% { transform: translateX(4px); } 100% { filter: none; } }
.bossname { position: absolute; top: -26px; white-space: nowrap; font-family: var(--f-display); font-size: .9rem; color: #fff; text-shadow: 0 2px 4px #000; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 200; }
.proj { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle, #fff 20%, var(--el) 55%, transparent 72%); box-shadow: 0 0 12px var(--el); }
.proj.big { width: 34px; height: 34px; }
.dmg { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 1.05rem; color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.6); text-shadow: 0 2px 0 rgba(0,0,0,.6); animation: rise .9s ease-out forwards; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dmg.eff { color: #ffe066; font-size: 1.2rem; }
.dmg.weak { color: #c8cbe0; font-size: .9rem; }
.dmg.crit { color: #ff8a3d; font-size: 1.35rem; }
.dmg.heal { color: #7dffa8; }
.dmg.skill { color: var(--r5); font-size: 1.4rem; }
@keyframes rise { 0% { opacity: 0; margin-top: 6px; transform: translate(-50%,-50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 100% { opacity: 0; margin-top: -42px; transform: translate(-50%,-50%) scale(1); } }
.hud { position: absolute; top: 10px; left: 10px; z-index: 210; }
.hud .stg { font-family: var(--f-display); font-size: .95rem; padding: 4px 10px; border-radius: 999px; background: rgba(10,12,30,.55); color: #fff; }
.banner { position: absolute; left: 0; right: 0; top: 34%; z-index: 220; text-align: center; font-family: var(--f-display); font-size: clamp(1.8rem, 9vw, 3.2rem); letter-spacing: .08em; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 24px rgba(0,0,0,.4); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.banner.win { color: var(--r5); } .banner.lose { color: var(--bad); } .banner.boss { color: var(--bad); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.gemfly { position: fixed; z-index: 50; width: 12px; height: 12px; background: var(--astral); border-radius: 2px; box-shadow: 0 0 8px var(--astral); pointer-events: none; }
@media (max-width: 560px) { .brand small { display: none; } .brand { font-size: 1.2rem; } }
.ctl { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn.spd[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-hi); }
#stagebar .pw { display: flex; gap: 6px; font-size: .8rem; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
#stagebar .pw.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
#stagebar .pw.mid { color: #f2a83b; }
#stagebar .pw.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.logbox summary { cursor: pointer; color: var(--muted); font-size: .85rem; padding: 4px 0; }
.logbox .log { margin-top: 8px; }

/* ---------- Combat ---------- */
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; }
.slot-empty { border: 1px dashed var(--line); border-radius: 14px; aspect-ratio: .78; display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; padding: 8px; }
.arena { border: 1px solid var(--line); border-radius: 18px; background: var(--ink-2); padding: 16px; display: grid; gap: 14px; }
.side { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.unit { background: var(--ink); border-radius: 10px; padding: 8px; display: grid; gap: 5px; min-width: 0; transition: opacity .3s; }
.unit.dead { opacity: .3; }
.unit.hit { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.unit .nm { font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp { height: 6px; background: var(--ink-3); border-radius: 3px; overflow: hidden; }
.hp b { display: block; height: 100%; background: var(--ok); transition: width .25s; }
.enemy .hp b { background: var(--bad); }
.unit .num { font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.vs { text-align: center; font-family: var(--f-display); color: var(--brass); letter-spacing: .2em; font-size: .9rem; }
.log { font-size: .82rem; background: var(--ink); border-radius: 10px; padding: 10px 12px; max-height: 170px; overflow-y: auto; display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.log .skillline { color: var(--r5); }
.log .win { color: var(--ok); font-weight: 700; }
.log .lose { color: var(--bad); font-weight: 700; }

.idle { border: 1px solid color-mix(in srgb, var(--brass) 50%, var(--line)); border-radius: 18px; padding: 14px 16px; background: linear-gradient(120deg, color-mix(in srgb, var(--brass) 14%, var(--ink-2)), var(--ink-2)); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.idle .loot { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.idle .loot b { font-size: 1.2rem; color: var(--brass-hi); }
.idle .loot small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.switch input { accent-color: var(--brass); width: 18px; height: 18px; }
[hidden] { display: none !important; }
.pull-btns .btn { flex: 1 1 150px; }
.pull-btns { width: 100%; max-width: 420px; }
.meter .row { gap: 8px; } .meter .row b { white-space: nowrap; }
.elc { font-size: .66rem; font-weight: 700; letter-spacing: .04em; color: var(--el); border: 1px solid var(--el); border-radius: 999px; padding: 1px 6px; justify-self: start; }
.unit .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-width: 0; }
.unit.boss { grid-column: 1 / -1; border: 1px solid var(--bad); }
.log .eff { color: var(--ok); }
.log .weak { color: var(--muted); }
.log .bossline { color: var(--bad); font-weight: 700; }
.chart { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.chart b { font-weight: 600; }
.missions { display: grid; gap: 10px; }
.mission { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--ink-2); }
.mission.done { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.mission.claimed { opacity: .5; }
.mission .t { font-weight: 600; }
.mission .r { font-size: .8rem; color: var(--brass-hi); }
.mission .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--ink); overflow: hidden; }
.mission .bar b { display: block; height: 100%; background: var(--ok); }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink-3); border: 1px solid var(--brass); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
footer { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
footer .btn { padding: 6px 12px; font-size: .8rem; }
.flash { position: fixed; inset: 0; background: radial-gradient(circle, color-mix(in srgb, var(--r5) 55%, transparent), transparent 70%); pointer-events: none; animation: flash .9s forwards; z-index: 9; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

};
const artOf = id => (S && S.heroes[id] && evolved(S.heroes[id]) && PORTRAITS_EVO[id]) || PORTRAITS[id];
const H = Object.fromEntries(HEROES.map(h => [h.id, h]));
const COST = 160, RATE5 = 0.015, RATE4 = 0.12, SOFT = 60, HARD = 80, PITY4 = 10, MAXSTAR = 6;
const CLASS_NOTE = {
  Mage:"Frappe tous les ennemis (×0,6).", Guerrier:"Frappe un ennemi au hasard.", Assassin:"30 % de coup critique (×1,8).",
  Soigneur:"Soigne l'allié le plus blessé s'il est sous 70 % de PV.", Gardien:"Beaucoup de PV, attire les coups (50 %).", Archer:"Vise l'ennemi le plus faible."
};

/* ================== ÉTAT ================== */
const KEY = "eveil-des-astres-v1";
function fresh() {
  return { gems: 3200, pots: 12, pity5: 0, pity4: 0, stage: 1, pulls: 0, lastCollect: Date.now(), auto: true,
    heroes: { pip:{lvl:1,stars:3,dupes:0}, gorm:{lvl:1,stars:3,dupes:0}, mira:{lvl:1,stars:3,dupes:0} },
    team: ["gorm","mira","pip"] };
}
let S, ui = { tab:"battle", sel:null, lastPull:[], battle:null };
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(fresh(), JSON.parse(raw)); } catch(e) {} return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ================== RÈGLES ================== */
const cap = st => 10 + st * 10;                        // ★3 → niv. 40 … ★6 → niv. 70
const starCost = (h, st) => st - h.r + 1;             // doublons pour passer à l'étoile suivante
const lvlCost = lvl => Math.ceil(lvl / 10);            // potions par niveau
const evolved = o => o.stars >= MAXSTAR;
function stats(id) {
  const h = H[id], o = S.heroes[id];
  const m = (1 + (o.lvl - 1) * 0.05) * (1 + (o.stars - h.r) * 0.15) * (evolved(o) ? 1.25 : 1);
  return { hp: Math.round(h.hp * m), atk: Math.round(h.atk * m), power: Math.round((h.hp * m) / 4 + h.atk * m * 2) };
}
function rate5() { return S.pity5 + 1 >= HARD ? 1 : RATE5 + Math.max(0, S.pity5 + 1 - SOFT) * 0.07; }
function rollOne() {
  const p5 = rate5(); S.pity5++; S.pity4++; S.pulls++;
  const r = Math.random(); let rar;
  if (r < p5) { rar = 5; S.pity5 = 0; S.pity4 = 0; }
  else if (S.pity4 >= PITY4 || r < p5 + RATE4) { rar = 4; S.pity4 = 0; }
  else rar = 3;
  const pool = HEROES.filter(h => h.r === rar), h = pool[Math.floor(Math.random() * pool.length)];
  const owned = S.heroes[h.id]; let isNew = false;
  if (owned) owned.dupes++; else { S.heroes[h.id] = { lvl:1, stars:h.r, dupes:0 }; isNew = true; }
  return { id: h.id, isNew };
}
function summon(n) {
  if (S.gems < COST * n) return toast("Pas assez de gemmes. Gagnez des combats pour en obtenir.");
  S.gems -= COST * n;
  const res = []; for (let i = 0; i < n; i++) res.push(rollOne());
  ui.lastPull = res; track("pull", n); save();
  const altar = document.querySelector(".altar"); altar && altar.classList.add("casting");
  setTimeout(() => {
    if (res.some(x => H[x.id].r === 5)) { const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f); setTimeout(() => f.remove(), 900); }
    render();
  }, 500);
}

/* ================== RENDU ================== */
const $ = s => document.querySelector(s);
const starsTxt = (n, r) => `<span class="stars r${r}">${"★".repeat(n)}${n < MAXSTAR ? `<span style="opacity:.25">${"★".repeat(MAXSTAR - n)}</span>` : ""}</span>`;
function cardHTML(id, opts = {}) {
  const h = H[id], o = S.heroes[id] || { lvl:1, stars:h.r, dupes:0 }, evo = S.heroes[id] && evolved(o);
  const tag = opts.isNew === true ? `<span class="tag">Nouveau</span>` : opts.isNew === false ? `<span class="tag dupe">+1 doublon</span>` : "";
  const inTeam = opts.showTeam && S.team.includes(id) ? `<span class="team-dot" title="Dans l'équipe"></span>` : "";
  const tagName = opts.button ? "button" : "div";
  return `<${tagName} class="card r${h.r}${evo ? " evo" : ""}${opts.locked ? " locked" : ""}" ${opts.button ? `data-hero="${id}" aria-label="${h.name}"` : ""} style="--el:var(${EL[h.el]})${opts.delay != null ? `;animation-delay:${opts.delay}ms` : ""}">
    ${tag}${inTeam}
    <div class="portrait${artOf(id) ? " art" : ""}">${artOf(id) ? `<img src="${artOf(id)}" alt="" loading="lazy">` : `<span>${h.name[0]}</span>`}</div>
    <div class="nm">${evo ? h.evo : h.name}</div>
    ${starsTxt(o.stars, h.r)}
    ${opts.hideLvl ? "" : `<div class="lvl">${opts.locked ? "Non obtenu" : `Niv. ${o.lvl}/${cap(o.stars)}`}</div>`}
  </${tagName}>`;
}

function renderWallet() { $("#w-gems").textContent = S.gems.toLocaleString("fr-FR"); $("#w-pots").textContent = S.pots; $("#w-stage").textContent = S.stage; }

function renderSummon() {
  const toHard = HARD - S.pity5, p5 = Math.min(100, rate5() * 100);
  const res = ui.lastPull;
  $("#p-summon").innerHTML = `
    <div class="altar">
      <div><p class="eyebrow">Bannière permanente</p><h2>Le Cercle des Astres</h2></div>
      <div class="sigil"><span>✦</span></div>
      <div class="pull-btns">
        <button class="btn" id="pull1" ${S.gems < COST ? "disabled" : ""}>Invoquer ×1 <small>${COST}</small></button>
        <button class="btn primary" id="pull10" ${S.gems < COST * 10 ? "disabled" : ""}>Invoquer ×10 <small>${COST * 10}</small></button>
      </div>
      <div class="pity">
        <div class="meter"><div class="row"><span>★5 garanti dans</span><b>${toHard} tirage${toHard > 1 ? "s" : ""}</b></div><div class="bar"><b style="width:${S.pity5 / HARD * 100}%"></b></div></div>
        <div class="meter r4"><div class="row"><span>★4 garanti dans</span><b>${PITY4 - S.pity4} tirage${PITY4 - S.pity4 > 1 ? "s" : ""}</b></div><div class="bar"><b style="width:${S.pity4 / PITY4 * 100}%"></b></div></div>
      </div>
      <p class="rates">Taux affichés : <b>★5 ${(RATE5 * 100).toFixed(1)} %</b>, <b>★4 ${(RATE4 * 100).toFixed(0)} %</b>, ★3 ${(100 - RATE5 * 100 - RATE4 * 100).toFixed(1)} %. Le taux ★5 augmente de 7 points par tirage après le ${SOFT}ᵉ sans ★5 (actuellement <b>${p5.toFixed(1)} %</b>). Les doublons servent à monter les étoiles.</p>
    </div>
    ${res.length ? `<div class="toolbar"><h2>Résultat</h2><span class="muted">${res.filter(r => r.isNew).length} nouveau(x) héros</span></div>
      <div class="results">${res.map((r, i) => cardHTML(r.id, { isNew: r.isNew, delay: i * 70, hideLvl: true })).join("")}</div>` : ""}
  `;
  $("#pull1").onclick = () => summon(1);
  $("#pull10").onclick = () => summon(10);
}

function renderHeroes() {
  const owned = HEROES.filter(h => S.heroes[h.id]), missing = HEROES.filter(h => !S.heroes[h.id]);
  if (!ui.sel || !S.heroes[ui.sel]) ui.sel = owned[0]?.id;
  const sorted = owned.sort((a, b) => b.r - a.r || stats(b.id).power - stats(a.id).power);
  $("#p-heroes").innerHTML = `
    ${ui.sel ? sheetHTML(ui.sel) : ""}
    <div class="toolbar"><div><p class="eyebrow">Collection</p><h2>${owned.length} / ${HEROES.length} héros</h2></div><span class="muted">Point doré = dans l'équipe (${S.team.length}/3)</span></div>
    <div class="roster">${sorted.map(h => cardHTML(h.id, { button: true, showTeam: true })).join("")}${missing.map(h => cardHTML(h.id, { locked: true })).join("")}</div>
  `;
  document.querySelectorAll("#p-heroes [data-hero]").forEach(b => b.onclick = () => { ui.sel = b.dataset.hero; renderHeroes(); $("#p-heroes .sheet")?.scrollIntoView({ behavior: "smooth", block: "nearest" }); });
  bindSheet();
}

function sheetHTML(id) {
  const h = H[id], o = S.heroes[id], st = stats(id), c = cap(o.stars), maxed = o.lvl >= c;
  const need = o.stars < MAXSTAR ? starCost(h, o.stars) : 0;
  const canStar = o.stars < MAXSTAR && maxed && o.dupes >= need;
  const inTeam = S.team.includes(id);
  const steps = []; for (let s = h.r; s <= MAXSTAR; s++) steps.push(s);
  let starMsg;
  if (o.stars >= MAXSTAR) starMsg = "Forme ultime atteinte.";
  else if (!maxed) starMsg = `Atteignez le niveau ${c} pour l'éveil (★${o.stars + 1}).`;
  else if (o.dupes < need) starMsg = `Il faut ${need} doublon${need > 1 ? "s" : ""} (vous en avez ${o.dupes}).`;
  else starMsg = `Prêt : ${need} doublon${need > 1 ? "s" : ""} → ★${o.stars + 1}${o.stars + 1 === MAXSTAR ? " et évolution !" : ""}`;
  return `<div class="sheet">
    ${cardHTML(id)}
    <div class="sheet-body">
      <div><p class="eyebrow">${h.cls} · rareté d'origine ★${h.r}</p><h2>${evolved(o) ? h.evo : h.name}</h2></div>
      <div class="chips"><span class="chip el" style="--el:var(${EL[h.el]})">${h.el}</span><span class="chip">${CLASS_NOTE[h.cls]}</span></div>
      <div class="statgrid">
        <div class="stat"><small>Puissance</small><b>${st.power.toLocaleString("fr-FR")}</b></div>
        <div class="stat"><small>PV</small><b>${st.hp.toLocaleString("fr-FR")}</b></div>
        <div class="stat"><small>Attaque</small><b>${st.atk}</b></div>
        <div class="stat"><small>Doublons</small><b>${o.dupes}</b></div>
      </div>
      <div><p class="eyebrow" style="margin-bottom:6px">Chemin d'éveil</p>
        <div class="path" style="grid-template-columns:repeat(${steps.length},1fr)">${steps.map(s => `<div class="${s < o.stars ? "done" : s === o.stars ? "now" : ""}">★${s}${s === MAXSTAR ? " · Évolution" : ""}</div>`).join("")}</div>
      </div>
      <div class="skill ${evolved(o) ? "" : "off"}"><b>Compétence d'éveil</b> — ${h.skill}, tous les 3 tours. ${evolved(o) ? "Débloquée." : "Se débloque à ★6."}</div>
      <div class="actions">
        <button class="btn" id="lv1" ${maxed || S.pots < lvlCost(o.lvl) ? "disabled" : ""}>Niveau +1 <small>${lvlCost(o.lvl)} potion${lvlCost(o.lvl) > 1 ? "s" : ""}</small></button>
        <button class="btn" id="lvmax" ${maxed || S.pots < lvlCost(o.lvl) ? "disabled" : ""}>Monter au max possible</button>
        <button class="btn primary" id="starup" ${canStar ? "" : "disabled"}>Éveiller ★${Math.min(o.stars + 1, MAXSTAR)}</button>
        <button class="btn" id="teamtg">${inTeam ? "Retirer de l'équipe" : "Ajouter à l'équipe"}</button>
      </div>
      <p class="muted" style="margin:0;font-size:.85rem">${starMsg}</p>
    </div>
  </div>`;
}
function bindSheet() {
  const id = ui.sel; if (!id) return;
  const o = S.heroes[id], h = H[id];
  const up = () => { const c = lvlCost(o.lvl); if (o.lvl < cap(o.stars) && S.pots >= c) { S.pots -= c; o.lvl++; track("lvl"); return true; } return false; };
  $("#lv1").onclick = () => { up(); save(); render(); };
  $("#lvmax").onclick = () => { let n = 0; while (up()) n++; save(); render(); toast(`${h.name} gagne ${n} niveau${n > 1 ? "x" : ""}.`); };
  $("#starup").onclick = () => {
    const need = starCost(h, o.stars); if (o.dupes < need) return;
    o.dupes -= need; o.stars++; save();
    if (evolved(o)) { const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f); setTimeout(() => f.remove(), 900); toast(`${h.name} évolue en ${h.evo} !`); }
    else toast(`${h.name} passe à ★${o.stars}. Niveau max : ${cap(o.stars)}.`);
    render();
  };
  $("#teamtg").onclick = () => {

    else if (S.team.length >= 3) return toast("L'équipe est complète (3 héros). Retirez-en un d'abord.");
    else S.team.push(id);

  };
}

/* ================== COMBAT ================== */
// Cycle : Feu > Nature > Terre > Eau > Feu. Lumière et Ombre se battent mutuellement. Astre est neutre.
const BEATS = { Feu:"Nature", Nature:"Terre", Terre:"Eau", Eau:"Feu" };
function elMult(a, d) {
  if (BEATS[a] === d) return 1.3;
  if (BEATS[d] === a) return 0.75;
  if ((a === "Lumière" && d === "Ombre") || (a === "Ombre" && d === "Lumière")) return 1.3;
  return 1;
}
const FOES = [
  { name:"Slime des brumes", el:"Eau" }, { name:"Spectre errant", el:"Ombre" }, { name:"Diablotin de braise", el:"Feu" },
  { name:"Golem de pierre", el:"Terre" }, { name:"Bulbe carnivore", el:"Nature" }, { name:"Feu follet", el:"Lumière" }
];
const BOSSES = [
  { name:"Roi Slime des abysses", el:"Eau" }, { name:"Seigneur des braises", el:"Feu" }, { name:"Reine des ronces", el:"Nature" },
  { name:"Titan de basalte", el:"Terre" }, { name:"Archange terni", el:"Lumière" }, { name:"Seigneur du néant", el:"Ombre" }
];
const MON_COLOR = { Eau:"#4fa6e3", Ombre:"#8a63d6", Feu:"#e2744f", Terre:"#a77b52", Nature:"#6fbf73", Lumière:"#f0d27a", Astre:"#74d4cd" };
const BIOME = {
  Eau:     ["#24467f", "#8cc8e8", "#3a7690", "#2f7f86"],
  Feu:     ["#3d1a2a", "#e88a54", "#7a3a30", "#6b4030"],
  Nature:  ["#2d5a7a", "#a8dcc0", "#3f7d4f", "#4f8f44"],
  Terre:   ["#43375a", "#d9b38a", "#7a6048", "#8a6a44"],
  Ombre:   ["#100d26", "#4b3a78", "#2b2350", "#2d2648"],
  Lumière: ["#5f74c4", "#fbe7b0", "#c9b27a", "#a99257"],
};
const isBoss = stage => stage % 5 === 0;
function makeFoes(stage) {
  const hp = Math.round(520 * Math.pow(1.22, stage - 1)), atk = Math.round(62 * Math.pow(1.2, stage - 1));
  if (isBoss(stage)) {
    const b = BOSSES[(stage / 5 - 1) % BOSSES.length], bhp = Math.round(hp * 3.4);
    return [{ ...b, hp: bhp, max: bhp, atk: Math.round(atk * 1.9), foe: true, boss: true }];
  }
  return [0, 1, 2].map(i => { const f = FOES[(stage * 2 + i) % FOES.length]; return { ...f, hp, max: hp, atk: Math.round(atk * (i === 1 ? 1.15 : 1)), foe: true }; });
}

/* ---- Simulation (calcul instantané, rejoué ensuite en animation) ---- */
const RANGED = { Mage: true, Archer: true, Soigneur: true };
function simulate() {
  const A = S.team.map(id => { const s = stats(id), o = S.heroes[id]; return { id, el: H[id].el, name: evolved(o) ? H[id].evo : H[id].name, cls: H[id].cls, hp: s.hp, max: s.hp, atk: s.atk, evo: evolved(o), lvl: o.lvl }; });
  const E = makeFoes(S.stage), frames = [];
  const alive = arr => arr.filter(u => u.hp > 0);
  const snap = (text, kind, ev) => frames.push({ a: A.map(u => u.hp), e: E.map(u => u.hp), text, kind, ev });
  const rnd = () => 0.9 + Math.random() * 0.2;
  const tag = m => m > 1 ? " (efficace !)" : m < 1 ? " (peu efficace)" : "";
  if (E[0].boss) snap(`BOSS — ${E[0].name} (${E[0].el}) barre la route !`, "bossline");
  else snap(`Étape ${S.stage} : ${E.map(e => `${e.name} (${e.el})`).join(", ")} apparaissent.`);
  for (let turn = 1; turn <= 25 && alive(A).length && alive(E).length; turn++) {
    A.forEach((u, ai) => {
      if (u.hp <= 0 || !alive(E).length) return;
      const src = "a" + ai;
      if (u.evo && turn % 3 === 0) {
        const tg = alive(E), v = tg.map(e => { const d = Math.round(u.atk * 1.6 * elMult(u.el, e.el) * rnd()); e.hp = Math.max(0, e.hp - d); return d; });
        snap(`✦ ${u.name} déclenche sa compétence d'éveil !`, "skillline", { s: src, t: tg.map(e => "e" + E.indexOf(e)), v, type: "skill", el: u.el, ranged: true });
        return;
      }
      if (u.cls === "Soigneur") {
        const w = alive(A).sort((x, y) => x.hp / x.max - y.hp / y.max)[0];
        if (w && w.hp / w.max < 0.7) {
          const heal = Math.round(u.atk * 1.8 * rnd()); w.hp = Math.min(w.max, w.hp + heal);
          snap(`${u.name} soigne ${w.name} (+${heal}).`, "", { s: src, t: ["a" + A.indexOf(w)], v: [heal], type: "heal", el: u.el, ranged: true });
          return;
        }
      }
      if (u.cls === "Mage") {
        const tg = alive(E), ms = tg.map(e => elMult(u.el, e.el)), v = tg.map((e, i) => { const d = Math.round(u.atk * 0.6 * ms[i] * rnd()); e.hp = Math.max(0, e.hp - d); return d; });
        snap(`${u.name} frappe tous les ennemis.`, "", { s: src, t: tg.map(e => "e" + E.indexOf(e)), v, ms, type: "aoe", el: u.el, ranged: true });
        return;
      }
      const tgts = alive(E);
      const t = u.cls === "Archer" ? tgts.sort((x, y) => x.hp - y.hp)[0] : tgts[Math.floor(Math.random() * tgts.length)];
      const m = elMult(u.el, t.el);
      let dmg = Math.round(u.atk * m * rnd()), crit = u.cls === "Assassin" && Math.random() < 0.3;
      if (crit) dmg = Math.round(dmg * 1.8);
      t.hp = Math.max(0, t.hp - dmg);
      snap(`${u.name} → ${t.name} : ${dmg}${crit ? " (critique)" : ""}${tag(m)}${t.hp === 0 ? " — vaincu" : ""}`, m > 1 ? "eff" : m < 1 ? "weak" : "",
        { s: src, t: ["e" + E.indexOf(t)], v: [dmg], ms: [m], crit, type: "hit", el: u.el, ranged: !!RANGED[u.cls] });
    });
    for (const e of E.flatMap(x => x.boss ? [x, x] : [x])) {
      if (e.hp <= 0 || !alive(A).length) continue;
      const al = alive(A), guard = al.find(u => u.cls === "Gardien");
      const t = guard && Math.random() < 0.5 ? guard : al[Math.floor(Math.random() * al.length)];
      const m = elMult(e.el, t.el), dmg = Math.round(e.atk * m * rnd()); t.hp = Math.max(0, t.hp - dmg);
      snap(`${e.name} → ${t.name} : ${dmg}${tag(m)}${t.hp === 0 ? " — K.O." : ""}`, "",
        { s: "e" + E.indexOf(e), t: ["a" + A.indexOf(t)], v: [dmg], ms: [m], type: "hit", el: e.el, ranged: false });
    }
  }
  const win = alive(A).length > 0 && !alive(E).length;
  return { A, E, frames, win };
}

/* ---- Scène ---- */
const HERO_POS = [[31, 66], [15, 50], [15, 84]];
const FOE_POS  = [[69, 66], [85, 50], [85, 84]];
const BOSS_POS = [74, 84];
const speed = () => (S.speed === 2 ? 2 : 1);
const frameMs = () => 620 / speed();

function sceneHTML(b) {
  const foes = b ? b.E : makeFoes(S.stage);
  const allies = b ? b.A : S.team.map(id => ({ id, el: H[id].el, name: H[id].name, evo: evolved(S.heroes[id]) }));
  const [s1, s2, hill, ground] = BIOME[foes[0].el] || BIOME.Nature;
  const heroes = allies.map((u, i) => {
    const [x, y] = HERO_POS[i], art = artOf(u.id);
    return `<div class="u hero${u.evo ? " evo" : ""}" id="u-a${i}" style="left:${x}%;top:${y}%;--el:var(${EL[u.el]});z-index:${y}">
      <div class="hpbar"><b></b></div>
      <div class="body"><div class="tok">${art ? `<img src="${art}" alt="">` : `<span>${u.name[0]}</span>`}</div></div>
      <div class="shadow"></div></div>`;
  }).join("");
  const mons = foes.map((f, i) => {
    const [x, y] = f.boss ? BOSS_POS : FOE_POS[i];
    return `<div class="u foe${f.boss ? " boss" : ""}" id="u-e${i}" style="left:${x}%;top:${y}%;z-index:${y};animation-delay:${i * 90}ms">
      <div class="hpbar"><b></b></div>
      <div class="body" style="animation-delay:-${i * 0.4}s">${monsterSVG(f.el, f.boss)}</div>
      <div class="shadow"></div>${f.boss ? `<div class="bossname">${f.name}</div>` : ""}</div>`;
  }).join("");
  return `<div class="scene" id="scene" style="--sky1:${s1};--sky2:${s2};--hill:${hill};--ground:${ground}">
      <div class="sky"></div><div class="orb"></div><div class="hills"></div><div class="hills far"></div><div class="ground"></div>
      ${heroes}${mons}
      <div class="fx" id="fx"></div>
      <div class="hud"><span class="stg">${isBoss(S.stage) ? "BOSS · " : ""}Étape ${S.stage}</span></div>
      <div class="banner" id="banner" hidden></div>
    </div>`;
}

function unitEl(code) { return $("#u-" + code); }
function centerOf(el) {
  const sc = $("#scene").getBoundingClientRect(), r = el.querySelector(".body").getBoundingClientRect();
  return [r.left - sc.left + r.width / 2, r.top - sc.top + r.height * 0.45];
}
function applyHP(f) {
  const b = ui.battle; if (!b) return;
  f.a.forEach((hp, i) => setBar("a" + i, hp, b.A[i].max));
  f.e.forEach((hp, i) => setBar("e" + i, hp, b.E[i].max));
}
function setBar(code, hp, max) {
  const el = unitEl(code); if (!el) return;
  const p = Math.max(0, hp / max * 100), bar = el.querySelector(".hpbar b");
  bar.style.width = p + "%"; bar.classList.toggle("low", p < 30);
  el.classList.toggle("dead", hp <= 0);
}
function floatText(el, txt, cls) {
  const fx = $("#fx"); if (!fx || !el) return;
  const [x, y] = centerOf(el), d = document.createElement("div");
  d.className = "dmg " + cls; d.textContent = txt;
  d.style.left = (x + (Math.random() * 20 - 10)) + "px"; d.style.top = (y - 10) + "px";
  fx.appendChild(d); setTimeout(() => d.remove(), 900);
}
function shoot(from, to, el, dur, big) {
  const fx = $("#fx"); if (!fx || !from || !to) return;
  const [x1, y1] = centerOf(from), [x2, y2] = centerOf(to), p = document.createElement("div");
  p.className = "proj" + (big ? " big" : ""); p.style.setProperty("--el", `var(${EL[el] || "--brass"})`);
  p.style.left = x1 + "px"; p.style.top = y1 + "px"; fx.appendChild(p);
  const a = p.animate([{ transform: "translate(-50%,-50%) scale(.6)" }, { transform: `translate(calc(-50% + ${x2 - x1}px), calc(-50% + ${y2 - y1}px)) scale(1.1)` }], { duration: dur, easing: "ease-in" });
  a.onfinish = () => p.remove();
}
function lunge(el, dir, dur, far) {
  const body = el && el.querySelector(".body"); if (!body) return;
  const dx = dir * (far ? 60 : 16);
  body.animate([{ transform: "translateX(0)" }, { transform: `translateX(${dx}px) scale(1.06)`, offset: .45 }, { transform: "translateX(0)" }], { duration: dur, easing: "ease-out", composite: "add" });
}
function impact(el, ev, i) {
  if (!el) return;
  el.classList.remove("hitfx"); void el.offsetWidth; el.classList.add("hitfx");
  const v = ev.v[i], m = ev.ms ? ev.ms[i] : 1;
  if (ev.type === "heal") return floatText(el, "+" + v, "heal");
  if (ev.crit) return floatText(el, v + " CRITIQUE !", "crit");
  floatText(el, v + (m > 1 ? " !" : ""), ev.type === "skill" ? "skill" : m > 1 ? "eff" : m < 1 ? "weak" : "");
}
function playFrame(f) {
  const ev = f.ev, dur = frameMs();
  logLine(f.text, f.kind);
  if (!ev) { applyHP(f); return; }
  const src = unitEl(ev.s), dir = ev.s[0] === "a" ? 1 : -1;
  if (ev.type === "skill") { const sc = $("#scene"); sc && sc.animate([{ filter: "brightness(1.8)" }, { filter: "brightness(1)" }], { duration: dur }); floatText(src, "ÉVEIL !", "skill"); }
  if (ev.type === "heal") { src && src.querySelector(".body").animate([{ transform: "translateY(0)" }, { transform: "translateY(-10px)" }, { transform: "translateY(0)" }], { duration: dur * .5, composite: "add" }); }
  else lunge(src, dir, dur * .55, !ev.ranged);
  const fly = ev.ranged ? dur * .32 : 0, wait = ev.ranged ? dur * .18 : dur * .26;
  setTimeout(() => {
    ev.t.forEach(t => ev.ranged && shoot(src, unitEl(t), ev.el, fly, ev.type === "skill"));
    setTimeout(() => { applyHP(f); ev.t.forEach((t, i) => impact(unitEl(t), ev, i)); }, fly);
  }, wait);
}
function banner(txt, cls) {
  const b = $("#banner"); if (!b) return;
  b.textContent = txt; b.className = "banner " + cls; b.hidden = false;
}
function gemBurst(n) {
  const sc = $("#scene"), target = $("#w-gems"); if (!sc || !target) return;
  const s = sc.getBoundingClientRect(), t = target.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const g = document.createElement("div"); g.className = "gemfly";
    const x = s.left + s.width * (0.6 + Math.random() * 0.3), y = s.top + s.height * (0.5 + Math.random() * 0.2);
    g.style.left = x + "px"; g.style.top = y + "px"; document.body.appendChild(g);
    const a = g.animate([{ transform: "translate(0,0) rotate(45deg) scale(.4)", opacity: 0 }, { transform: `translate(${(Math.random() - .5) * 60}px,-40px) rotate(45deg) scale(1)`, opacity: 1, offset: .3 },
      { transform: `translate(${t.left - x}px,${t.top - y}px) rotate(45deg) scale(.6)`, opacity: .9 }], { duration: 900 + i * 60, easing: "ease-in", delay: i * 40 });
    a.onfinish = () => g.remove();
  }
}

/* ---- Déroulement ---- */
function startBattle() {
  if (!S.team.length) return toast("Ajoutez au moins un héros à l'équipe (onglet Héros).");
  const b = simulate(); ui.battle = { ...b, i: 0, done: false };
  if (!$("#scene-wrap")) renderBattle();
  $("#scene-wrap").innerHTML = sceneHTML(b);
  const lg = $("#log"); if (lg) lg.innerHTML = "";
  b.A.forEach((u, i) => setBar("a" + i, u.max, u.max)); b.E.forEach((u, i) => setBar("e" + i, u.max, u.max));
  $("#scene").classList.add("walking");
  if (isBoss(S.stage)) banner("BOSS", "boss");
  renderBattleControls(); renderStageBar();
  ui.battle.timer = setTimeout(() => { const sc = $("#scene"); sc && sc.classList.remove("walking"); const bn = $("#banner"); if (bn) bn.hidden = true; step(); }, 900 / speed() + (isBoss(S.stage) ? 500 : 0));
}
function step() {
  const b = ui.battle; if (!b || b.done) return;
  if (b.i >= b.frames.length) { b.timer = setTimeout(finish, 300); return; }
  playFrame(b.frames[b.i]); b.i++;
  b.timer = setTimeout(step, frameMs());
}
function finish() {
  const b = ui.battle; if (!b || b.done) return;
  clearTimeout(b.timer); b.done = true;
  applyHP(b.frames[b.frames.length - 1]);
  let msg;
  if (b.win) {
    const boss = isBoss(S.stage), g = (240 + S.stage * 20) * (boss ? 3 : 1), p = (3 + Math.floor(S.stage / 2)) * (boss ? 2 : 1);
    S.gems += g; S.pots += p; S.stage++; track("win");
    msg = `${boss ? "Boss vaincu ! " : "Victoire ! "}+${g} gemmes, +${p} potions. Étape ${S.stage} débloquée.`;
    banner(boss ? "BOSS VAINCU !" : "VICTOIRE", "win"); gemBurst(boss ? 12 : 6);
    if (boss) toast(msg);
  } else { S.gems += 60; msg = "Défaite… +60 gemmes. Montez vos héros en niveau ou en étoiles."; banner("DÉFAITE", "lose"); }
  b.result = { win: b.win, msg };
  save(); setTimeout(renderWallet, 700); renderBattleControls(); renderIdle(); renderStageBar(); logLine(msg, b.win ? "win" : "lose");
  scheduleAuto();
}
function logLine(t, kind) { const lg = $("#log"); if (!lg) return; const d = document.createElement("div"); d.textContent = t; if (kind) d.className = kind; lg.appendChild(d); lg.scrollTop = lg.scrollHeight; }

function renderStageBar() {
  const el = $("#stagebar"); if (!el) return;
  const teamPower = S.team.reduce((s, id) => s + stats(id).power, 0);
  const foes = makeFoes(S.stage), foePower = foes.reduce((s, f) => s + Math.round(f.max / 4 + f.atk * 2), 0);
  const ratio = teamPower / foePower, state = ratio >= 1.15 ? "ok" : ratio >= 0.85 ? "mid" : "bad";
  el.innerHTML = `<div><p class="eyebrow">Prochaine étape</p><h2>Étape ${S.stage}${isBoss(S.stage) ? " · Boss" : ""}</h2></div>
    <div class="pw ${state}"><span>Équipe ${teamPower.toLocaleString("fr-FR")}</span><span>vs</span><span>Ennemis ${foePower.toLocaleString("fr-FR")}</span></div>`;
}
function renderBattle() {
  const b = ui.battle;
  const slots = [0, 1, 2].map(i => S.team[i] ? cardHTML(S.team[i]) : `<div class="slot-empty">Emplacement libre<br>(onglet Héros)</div>`).join("");
  $("#p-battle").innerHTML = `
    <div class="toolbar" id="stagebar"></div>
    <div id="scene-wrap">${sceneHTML(b)}</div>
    <div class="ctl">
      <div class="actions" id="bctl"></div>
      <div class="actions">
        <button class="btn spd" id="spd" aria-pressed="${speed() === 2}">Vitesse ×${speed()}</button>
        <label class="switch"><input type="checkbox" id="auto" ${S.auto ? "checked" : ""}> En boucle</label>
      </div>
    </div>
    <div class="idle" id="idlebox"></div>
    <div><p class="eyebrow" style="margin-bottom:8px">Équipe</p><div class="slots">${slots}</div></div>
    <div class="chart"><b>Éléments :</b> Feu &gt; Nature &gt; Terre &gt; Eau &gt; Feu · Lumière ⇄ Ombre · Astre neutre. Avantage : dégâts ×1,3. Désavantage : ×0,75.</div>
    <details class="logbox"><summary>Journal de combat</summary><div class="log" id="log" aria-live="polite"></div></details>`;
  renderIdle(); renderStageBar();
  if (!b) { S.team.forEach((id, i) => setBar("a" + i, 1, 1)); makeFoes(S.stage).forEach((f, i) => setBar("e" + i, 1, 1)); }
  renderBattleControls();
  $("#auto").onchange = e => { S.auto = e.target.checked; save(); if (S.auto && !(ui.battle && !ui.battle.done)) scheduleAuto(); else clearTimeout(autoT); };
  $("#spd").onclick = () => { S.speed = speed() === 2 ? 1 : 2; save(); $("#spd").textContent = `Vitesse ×${speed()}`; $("#spd").setAttribute("aria-pressed", speed() === 2); };
}
function renderBattleControls() {
  const b = ui.battle, c = $("#bctl"); if (!c) return;
  if (b && !b.done) {
    c.innerHTML = `<button class="btn" id="skip">Passer</button>`;
    $("#skip").onclick = () => { clearTimeout(b.timer); while (b.i < b.frames.length) { logLine(b.frames[b.i].text, b.frames[b.i].kind); b.i++; } const sc = $("#scene"); sc && sc.classList.remove("walking"); finish(); };
  } else {
    c.innerHTML = `<button class="btn primary" id="fight" ${S.team.length ? "" : "disabled"}>${b ? (b.win ? `Étape ${S.stage}` : "Réessayer") : "Combattre"}</button>`;
    $("#fight").onclick = () => { clearTimeout(autoT); ui.battle = null; startBattle(); };
  }
}

/* ================== IDLE ================== */
const IDLE_CAP_H = 8;
const idleRate = () => ({ gems: 4 + S.stage * 1.5, pots: 0.15 + S.stage * 0.04 }); // par minute
function pending() {
  const mins = Math.min(IDLE_CAP_H * 60, Math.max(0, (Date.now() - (S.lastCollect || Date.now())) / 60000)), r = idleRate();
  return { mins, gems: Math.floor(mins * r.gems), pots: Math.floor(mins * r.pots) };
}
function collect() {
  const p = pending(); if (!p.gems && !p.pots) return toast("Rien à récolter pour l'instant.");
  S.gems += p.gems; S.pots += p.pots; S.lastCollect = Date.now(); track("collect"); save(); renderWallet(); renderIdle();
  toast(`Récolté : +${p.gems} gemmes, +${p.pots} potions.`);
}
function fmtDur(m) { const h = Math.floor(m / 60), mm = Math.floor(m % 60); return h ? `${h} h ${String(mm).padStart(2, "0")}` : `${mm} min`; }
function renderIdle() {
  const box = $("#idlebox"); if (!box) return;
  const p = pending(), r = idleRate(), full = p.mins >= IDLE_CAP_H * 60;
  box.innerHTML = `<div><p class="eyebrow">Récompenses d'absence · étape ${S.stage}</p>
      <div class="loot"><div><small>Gemmes</small><b>${p.gems}</b></div><div><small>Potions</small><b>${p.pots}</b></div><div><small>Accumulé</small><b>${fmtDur(p.mins)}</b>${full ? ' <span class="muted">(plein)</span>' : ""}</div></div>
      <p class="muted" style="margin:6px 0 0;font-size:.8rem">${r.gems.toFixed(1)} gemmes et ${r.pots.toFixed(2)} potions par minute, même jeu fermé. Maximum ${IDLE_CAP_H} h. Plus l'étape est haute, plus ça rapporte.</p></div>
    <button class="btn primary" id="collect">Récolter</button>`;
  $("#collect").onclick = collect;
}
setInterval(() => { if (ui.tab === "battle") renderIdle(); }, 5000);
let autoT;
function scheduleAuto() { clearTimeout(autoT); if (S.auto && ui.tab === "battle") autoT = setTimeout(() => { if (S.auto && ui.tab === "battle" && !(ui.battle && !ui.battle.done)) { ui.battle = null; startBattle(); } }, 1400); }

/* ================== MISSIONS QUOTIDIENNES ================== */
const MISSIONS = [
  { id:"pull",    t:"Invoquer 10 héros",                 goal:10, gems:300, pots:0 },
  { id:"win",     t:"Gagner 5 combats",                  goal:5,  gems:200, pots:5 },
  { id:"lvl",     t:"Gagner 10 niveaux de héros",        goal:10, gems:0,   pots:8 },
  { id:"collect", t:"Récolter les récompenses d'absence", goal:1,  gems:150, pots:0 },
];
const ALL_BONUS = 500;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function daily() {
  if (!S.daily || S.daily.date !== today()) S.daily = { date: today(), prog: {}, claimed: {} };
  return S.daily;
}
function track(id, n = 1) { const d = daily(); d.prog[id] = (d.prog[id] || 0) + n; renderBadge(); }
function claimable() { const d = daily(); let n = MISSIONS.filter(m => (d.prog[m.id] || 0) >= m.goal && !d.claimed[m.id]).length; if (allDone() && !d.claimed.all) n++; return n; }
function allDone() { const d = daily(); return MISSIONS.every(m => d.claimed[m.id]); }
function renderBadge() {
  const t = $("#tab-missions"); if (!t) return; const n = claimable();
  t.querySelector(".badge-slot").innerHTML = n ? `<span class="badge">${n}</span>` : "";
}
function claim(id) {
  const d = daily();
  if (id === "all") { if (!allDone() || d.claimed.all) return; d.claimed.all = true; S.gems += ALL_BONUS; toast(`Bonus du jour : +${ALL_BONUS} gemmes !`); }
  else {
    const m = MISSIONS.find(x => x.id === id); if (!m || d.claimed[id] || (d.prog[id] || 0) < m.goal) return;
    d.claimed[id] = true; S.gems += m.gems; S.pots += m.pots;
    toast(`Mission terminée : ${[m.gems && `+${m.gems} gemmes`, m.pots && `+${m.pots} potions`].filter(Boolean).join(", ")}.`);
  }
  save(); render();
}
function renderMissions() {
  const d = daily();
  const rew = m => [m.gems && `${m.gems} gemmes`, m.pots && `${m.pots} potions`].filter(Boolean).join(" + ");
  const now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), left = Math.round((mid - now) / 60000);
  $("#p-missions").innerHTML = `
    <div class="toolbar"><div><p class="eyebrow">Missions quotidiennes</p><h2>Objectifs du jour</h2></div><span class="muted">Nouvelles missions dans ${fmtDur(left)}</span></div>
    <div class="missions">
      ${MISSIONS.map(m => { const p = Math.min(m.goal, d.prog[m.id] || 0), done = p >= m.goal, cl = d.claimed[m.id];
        return `<div class="mission${done ? " done" : ""}${cl ? " claimed" : ""}">
          <div><div class="t">${m.t}</div><div class="r">${rew(m)}</div></div>
          <button class="btn${done && !cl ? " primary" : ""}" data-claim="${m.id}" ${done && !cl ? "" : "disabled"}>${cl ? "Réclamée" : done ? "Réclamer" : `${p} / ${m.goal}`}</button>
          <div class="bar"><b style="width:${p / m.goal * 100}%"></b></div></div>`; }).join("")}
      <div class="mission${allDone() ? " done" : ""}${d.claimed.all ? " claimed" : ""}">
        <div><div class="t">Terminer toutes les missions du jour</div><div class="r">${ALL_BONUS} gemmes</div></div>
        <button class="btn${allDone() && !d.claimed.all ? " primary" : ""}" data-claim="all" ${allDone() && !d.claimed.all ? "" : "disabled"}>${d.claimed.all ? "Réclamée" : allDone() ? "Réclamer" : `${MISSIONS.filter(m => d.claimed[m.id]).length} / ${MISSIONS.length}`}</button>
      </div>
    </div>`;
  document.querySelectorAll("[data-claim]").forEach(b => b.onclick = () => claim(b.dataset.claim));
}

/* ================== GÉNÉRAL ================== */
let toastT;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function render() {
  renderWallet();
  ["summon", "heroes", "battle", "missions"].forEach(t => { $("#p-" + t).hidden = ui.tab !== t; $("#tab-" + t).setAttribute("aria-selected", ui.tab === t); });
  if (ui.tab === "summon") renderSummon();
  if (ui.tab === "heroes") renderHeroes();
  if (ui.tab === "battle" && !(ui.battle && !ui.battle.done)) renderBattle();
  if (ui.tab === "missions") renderMissions();
  renderBadge();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { daily(); const sc = document.querySelector(".app"); sc && window.scrollTo({ top: 0 });
  if (ui.battle && !ui.battle.done) { clearTimeout(ui.battle.timer); ui.battle.i = ui.battle.frames.length; finish(); }
  if (b.dataset.tab !== "summon") ui.lastPull = ui.tab === "summon" ? [] : ui.lastPull;
  clearTimeout(autoT);
  ui.tab = b.dataset.tab; if (ui.tab === "battle") ui.battle = null; render();
  if (ui.tab === "battle" && S.auto && S.team.length) setTimeout(() => { if (ui.tab === "battle" && !ui.battle) startBattle(); }, 700);
});
$("#reset-btn").onclick = () => { $("#reset-confirm").hidden = false; setTimeout(() => $("#reset-confirm").hidden = true, 4000); };
$("#reset-confirm").onclick = () => { S = fresh(); ui = { tab:"battle", sel:null, lastPull:[], battle:null }; save(); $("#reset-confirm").hidden = true; render(); toast("Nouvelle partie commencée."); };

function start(data) { S = data && data.gems != null ? data : load(); render(); if (ui.tab === "battle" && S.auto && S.team.length) setTimeout(() => { if (ui.tab === "battle" && !ui.battle) startBattle(); }, 600); }
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data);
</script>
